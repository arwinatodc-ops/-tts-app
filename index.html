<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultimate TTS Pro V2</title>

<link rel="manifest" href="manifest.json">

<style>
body{font-family:Arial,sans-serif;background:#121212;color:#fff;margin:0}
body.light{background:#f5f5f5;color:#111}
.container{max-width:1200px;margin:auto;padding:20px}
.card{background:#1e1e1e;padding:15px;border-radius:12px;margin:12px 0}
body.light .card{background:#fff}
#textDisplay{height:350px;overflow:auto;background:#000;color:#fff;padding:12px;border-radius:8px;line-height:1.8}
body.light #textDisplay{background:#fafafa;color:#111}
button,input,select{padding:10px;border-radius:8px;border:none;margin:4px}
button{cursor:pointer}
.progress{height:8px;background:#444;border-radius:10px}
.bar{height:8px;width:0;background:#4caf50;border-radius:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
</style>
</head>

<body>
<div class="container">
<h2>Ultimate TTS Pro V2</h2>

<div class="card">
<div class="toolbar">
<input type="file" id="txtFile">
<select id="voice"></select>
<input type="range" id="rate" min="0.5" max="3" step="0.1" value="1">

<button onclick="startReading()">Start</button>
<button onclick="speechSynthesis.pause()">Pause</button>
<button onclick="speechSynthesis.resume()">Resume</button>
<button onclick="stopReading()">Stop</button>
</div>

<div id="textDisplay" contenteditable="true">
Paste text here...
</div>

<div class="progress"><div class="bar" id="bar"></div></div>

<div>
Words: <span id="wordCount">0</span><br>
Read: <span id="wordsRead">0</span><br>
ETA: <span id="eta">0</span><br>
Progress: <span id="pct">0%</span>
</div>
</div>
</div>

<script>
let voices=[],chunks=[],current=0,wordsRead=0;

function loadVoices(){
 voices=speechSynthesis.getVoices();
 voice.innerHTML="";
 voices.forEach((v,i)=>{
  let o=document.createElement("option");
  o.value=i;
  o.textContent=v.name;
  voice.appendChild(o);
 });
}
loadVoices();
speechSynthesis.onvoiceschanged=loadVoices;

function startReading(){
 let text=textDisplay.innerText;
 chunks=text.split(/[.!?]+/);
 speak();
}

function speak(){
 if(current>=chunks.length)return;

 let u=new SpeechSynthesisUtterance(chunks[current]);
 u.voice=voices[voice.value];
 u.rate=rate.value;

 u.onend=()=>{
  current++;
  speak();
 };

 speechSynthesis.speak(u);
}

function stopReading(){
 speechSynthesis.cancel();
 current=0;
}
</script>

<script>
if ("serviceWorker" in navigator) {
 navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
